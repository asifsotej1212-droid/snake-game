<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>৬ জনের সাপের খেলা 🐍</title>
<style>
  :root { --card:#151a24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; padding:0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2030, #0b0d12 60%);
    color:#fff;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 12px 24px;
  }
  h1 { font-size:1.45rem; margin:4px 0 2px; text-align:center; }
  .sub { color:#8b93a7; font-size:.82rem; margin-bottom:4px; text-align:center; }
  #charName { color:#4ade80; font-weight:700; font-size:.95rem; margin-bottom:10px; }
  .hud { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
  .hud .box { background:var(--card); border:1px solid #262c38; border-radius:12px; padding:6px 14px; text-align:center; min-width:78px; }
  .hud .box .lbl { font-size:.68rem; color:#8b93a7; }
  .hud .box .val { font-size:1.2rem; font-weight:800; }
  .wrap { position:relative; width:min(94vw, 520px); aspect-ratio:1/1; }
  canvas { width:100%; height:100%; display:block; border-radius:16px; border:2px solid #2b3342; background:#000;
           box-shadow:0 12px 44px rgba(0,0,0,.55); touch-action:none; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; background:rgba(7,9,14,.84); border-radius:16px; padding:18px;
  }
  .overlay .bigface { width:96px; height:96px; border-radius:50%; border:3px solid #fff; object-fit:cover; background:#222; }
  .overlay h2 { margin:0; font-size:1.55rem; }
  .overlay .otext { color:#c2c9d8; font-size:.95rem; }
  button { font-family:inherit; font-size:1rem; padding:11px 24px; border:none; border-radius:999px; cursor:pointer;
           background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-weight:800; box-shadow:0 4px 16px rgba(34,197,94,.35); }
  button:active { transform:scale(.96); }
  button.secondary { background:#262c38; box-shadow:none; }
  .hidden { display:none !important; }
  .dpad { margin-top:12px; display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:6px; }
  .dpad button { font-size:1.35rem; padding:0; border-radius:14px; background:#1b212c; border:1px solid #2b3342; color:#fff; }
  .dpad .up{grid-area:1/2/2/3} .dpad .left{grid-area:2/1/3/2} .dpad .right{grid-area:2/3/3/3} .dpad .down{grid-area:3/2/4/3}
  .dpad .none{grid-area:2/2/3/3; background:transparent; border:none; cursor:default;}
  .controls { font-size:.78rem; color:#6b7488; margin-top:10px; text-align:center; max-width:520px; line-height:1.5; }

  /* 🔊 সাউন্ড টগল */
  #muteBtn { position:fixed; top:12px; right:12px; z-index:900; background:#1b212c; border:1px solid #2b3342; color:#fff;
             font-size:1.15rem; width:44px; height:44px; border-radius:50%; padding:0; box-shadow:none; }

  /* 👻 জাম্পস্কেয়ার */
  .jumpscare { position:fixed; inset:0; z-index:1000; background:#000; display:flex; align-items:center; justify-content:center;
               animation: jsShake .09s infinite; cursor:pointer; }
  .jumpscare img { width:100%; height:100%; object-fit:cover; }
  @keyframes jsShake {
    0%{transform:translate(0,0)} 25%{transform:translate(-9px,7px)} 50%{transform:translate(9px,-7px)}
    75%{transform:translate(-7px,-9px)} 100%{transform:translate(7px,9px)}
  }
</style>
</head>
<body>
  <button id="muteBtn" title="সাউন্ড চালু/বন্ধ">🔊</button>

  <h1>🐍 ৬ জনের সাপের খেলা</h1>
  <div class="sub">ফল খাও → পরের জনের পালা আসবে!</div>
  <div id="charName">১নং খেলোয়াড়</div>

  <div class="hud">
    <div class="box"><div class="lbl">স্কোর</div><div class="val" id="score">০</div></div>
    <div class="box"><div class="lbl">সর্বোচ্চ</div><div class="val" id="hi">০</div></div>
    <div class="box"><div class="lbl">পর্যায়</div><div class="val" id="lvl">১</div></div>
    <div class="box"><div class="lbl">ফল</div><div class="val" id="fruitCount">০/৩</div></div>
  </div>

  <div class="wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <img class="bigface" id="ovFace" alt="">
      <h2 id="ovTitle">সাপের খেলা</h2>
      <div class="otext" id="ovText"></div>
      <button id="ovBtn">শুরু করুন ▶</button>
    </div>
  </div>

  <div class="jumpscare hidden" id="jumpscare">
    <img id="jsImg" alt="">
  </div>

  <div class="dpad" id="dpad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <div class="none"></div>
    <button class="right" data-d="right">▶</button>
    <button class="down" data-d="down">▼</button>
  </div>

  <div class="controls">
    তীর চিহ্ন / WASD দিয়ে চালাও &nbsp;•&nbsp; Space = বিরতি &nbsp;•&nbsp; মোবাইলে বাটন বা সোয়াইপ
    <br>⚠️ সাবধান — শেষে ভয়ংকর কিছু অপেক্ষা করছে 👀
  </div>

<script>
"use strict";
/* কোনো ত্রুটি হলে স্ক্রিনে দেখাও (ডিবাগে সুবিধা) */
window.addEventListener("error", function(ev){
  try {
    var t = document.getElementById("ovTitle"), x = document.getElementById("ovText");
    if (t) t.textContent = "⚠️ সমস্যা হয়েছে";
    if (x) x.textContent = (ev && ev.message) ? ev.message : "অজানা ত্রুটি";
  } catch(e){}
});

/* ---------- অবস্থা (state) ---------- */
let level = 0, totalScore = 0, fruitCount = 0, totalEaten = 0;
let prevSnake = [], snake = [], dir = DIRS[0], pendingDirs = [], food = {x:0,y:0};

/* ---------- খেলার যুক্তি ---------- */
function startLevel(){
  snake = [{x:6,y:10},{x:5,y:10},{x:4,y:10}];
  prevSnake = snake.map(p=>({x:p.x,y:p.y}));
  dir = DIRS[0]; pendingDirs = []; fruitCount = 0; stepAcc = 0;
  placeFood(); updateHUD();
}
function startGame(){
  ensureAudio(); playStart(); startBgm();
  level = 0; totalScore = 0; totalEaten = 0;
  startLevel(); hideOverlay(); state = "playing";
}
function placeFood(){
  const free = [];
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++)
    if (!snake.some(s => s.x===x && s.y===y)) free.push({x,y});
  food = free.length ? free[Math.floor(Math.random()*free.length)] : {x:0,y:0};
}
function queueDir(nd){
  const last = pendingDirs.length ? pendingDirs[pendingDirs.length-1] : dir;
  if (nd === last) return;
  if (nd.x === -last.x && nd.y === -last.y) return;   // উল্টো ঘোরা নিষেধ
  if (pendingDirs.length < 2) pendingDirs.push(nd);
}
function getSpeed(){
  // শুরুতে ধীর (২৮০ms), প্রতিটি ফল খেলে একটু একটু করে দ্রুত হবে
  return Math.max(85, 280 - totalEaten*4.2);
}
function step(){
  if (pendingDirs.length){
    const nd = pendingDirs.shift();
    if (!(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
  }
  prevSnake = snake.map(p=>({x:p.x,y:p.y}));
  const head = { x:snake[0].x + dir.x, y:snake[0].y + dir.y };
  if (head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS) return gameOver();
  snake.unshift(head);
  const ate = (head.x===food.x && head.y===food.y);
  if (ate) onEat(); else snake.pop();
  for (let i=1;i<snake.length;i++)
    if (snake[i].x===head.x && snake[i].y===head.y) return gameOver();
}
function onEat(){
  fruitCount++; totalEaten++; totalScore += 10 + level*2;
  mouthOpenUntil = performance.now() + 400;
  playBeep(fruitCount);
  if (fruitCount >= FRUITS_PER_LEVEL[level]){
    if (level < CHARACTERS.length-1) levelUp();
    else triggerJumpscare();
  } else placeFood();
  updateHUD();
}
function levelUp(){
  playLevelUp();
  level++;
  state = "levelup";
  levelupUntil = performance.now() + 2200;
  showOverlay(CHARACTERS[level].normalImg.src, "পরের খেলোয়াড়! 👤",
    CHARACTERS[level].name + "  •  লক্ষ্য: " + bn(FRUITS_PER_LEVEL[level]) + "টি " + CHARACTERS[level].fruit, null);
  updateHUD();
}
function triggerJumpscare(){
  state = "jumpscare";
  saveHigh();
  jumpscareUntil = performance.now() + 1800;
  jumpscare.classList.remove("hidden");
  playJumpscareSound();
}
function gameOver(){
  state = "gameover"; saveHigh(); playGameOver();
  showOverlay(CHARACTERS[level].normalImg.src, "খেলা শেষ! 💀", "স্কোর: " + bn(totalScore), "আবার খেলুন 🔄");
}
function saveHigh(){
  if (totalScore > high){ high = totalScore; storeSet("snake6_high", String(high)); updateHUD(); }
}
function togglePause(){
  if (state === "playing"){ state = "paused"; showOverlay(CHARACTERS[level].normalImg.src, "বিরতি ⏸", "তুমি " + CHARACTERS[level].name + "-এর পালা খেলছো", "চালিয়ে যান ▶"); }
  else if (state === "paused"){ hideOverlay(); state = "playing"; }
}
function clickBtn(){
  if (state==="menu" || state==="gameover" || state==="won") startGame();
  else if (state==="paused"){ hideOverlay(); state="playing"; }
}

/* ---------- শব্দ ---------- */
function ensureAudio(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
  return audioCtx;
}
function tone(freq, t0, dur, type, vol, slideTo){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || "triangle";
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
/* 🍎 ফল খাওয়ার শব্দ — একের পর এক ফল খেলে সুর উঁচু হতে থাকে */
function playBeep(n){
  if (!soundOn || !ensureAudio()) return;
  try {
    const t = audioCtx.currentTime, base = 520 + (n||0)*38;
    tone(base, t, 0.09, "triangle", 0.10, base*1.5);
    tone(base*1.5, t+0.07, 0.14, "sine", 0.08, base*2);
  } catch(e){}
}
/* ▶ শুরুর শব্দ */
function playStart(){
  if (!soundOn || !ensureAudio()) return;
  try {
    const t = audioCtx.currentTime;
    [392,523,659].forEach((f,i)=> tone(f, t+i*0.09, 0.14, "square", 0.05));
  } catch(e){}
}
/* ⭐ পরের খেলোয়াড়ের শব্দ */
function playLevelUp(){
  if (!soundOn || !ensureAudio()) return;
  try {
    const t = audioCtx.currentTime;
    [523,659,784,1047].forEach((f,i)=> tone(f, t+i*0.11, 0.2, "triangle", 0.1));
    tone(1047, t+0.44, 0.45, "sine", 0.07);
  } catch(e){}
}
/* 💀 খেলা শেষের শব্দ */
function playGameOver(){
  if (!soundOn || !ensureAudio()) return;
  try {
    const t = audioCtx.currentTime;
    [440,392,349,262].forEach((f,i)=> tone(f, t+i*0.2, 0.3, "sawtooth", 0.07, f*0.9));
  } catch(e){}
}
/* 🎵 ব্যাকগ্রাউন্ড মিউজিক — সাপ যত দ্রুত, সুরও তত দ্রুত */
const SCALE = [261.63,293.66,329.63,392,440,523.25,587.33,659.25];
const MEL   = [0,2,4,2, 5,4,2,1, 0,2,4,7, 5,4,2,-1];
const BASS  = [130.81,130.81,174.61,196];
let bgmTimer = null, bgmNext = 0, bgmStep = 0;
function startBgm(){
  if (bgmTimer || !ensureAudio()) return;
  bgmNext = audioCtx.currentTime + 0.1; bgmStep = 0;
  bgmTimer = setInterval(bgmTick, 70);
}
function bgmTick(){
  if (!audioCtx) return;
  if (!soundOn || state !== "playing"){ bgmNext = audioCtx.currentTime + 0.1; return; }
  const beat = Math.max(0.11, Math.min(0.24, getSpeed()/1000 * 0.85));
  while (bgmNext < audioCtx.currentTime + 0.25){
    const m = MEL[bgmStep % 16];
    if (m >= 0) tone(SCALE[m], bgmNext, beat*1.6, "triangle", 0.028);
    if (bgmStep % 4 === 0) tone(BASS[(bgmStep>>2) % 4], bgmNext, beat*3.2, "sine", 0.05);
    bgmNext += beat; bgmStep++;
  }
}
function playJumpscareSound(){
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.95, t);
    master.gain.exponentialRampToValueAtTime(0.001, t+1.9);
    master.connect(audioCtx.destination);

    // সাদা আওয়াজ (গর্জন)
    const len = Math.floor(audioCtx.sampleRate * 1.9);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 0.5);
    const noise = audioCtx.createBufferSource(); noise.buffer = buf;
    const lp = audioCtx.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(180, t+1.6);
    noise.connect(lp).connect(master); noise.start(t);

    // চিৎকারের মতো নিচে নামতে থাকা কর্কশ শব্দ
    const o = audioCtx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(820, t);
    o.frequency.exponentialRampToValueAtTime(110, t+1.25);
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 13;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 70;
    lfo.connect(lfoG).connect(o.frequency);
    const og = audioCtx.createGain(); og.gain.setValueAtTime(0.55, t);
    og.gain.exponentialRampToValueAtTime(0.001, t+1.45);
    o.connect(og).connect(master); o.start(t); o.stop(t+1.5);
    lfo.start(t); lfo.stop(t+1.5);

    // গভীর বুম
    const b = audioCtx.createOscillator(); b.type = "sine";
    b.frequency.setValueAtTime(130, t); b.frequency.exponentialRampToValueAtTime(38, t+0.85);
    const bg = audioCtx.createGain(); bg.gain.setValueAtTime(0.7, t);
    bg.gain.exponentialRampToValueAtTime(0.001, t+1.05);
    b.connect(bg).connect(master); b.start(t); b.stop(t+1.1);
  } catch(e){}
}

/* ---------- রেন্ডার ---------- */
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "rgb("+r+","+g+","+b+")";
}
const bgCache = {};
function buildBG(lv){
  const c = CHARACTERS[lv];
  const cv = document.createElement("canvas");
  cv.width = W*DPR; cv.height = H*DPR;
  const x = cv.getContext("2d");
  x.setTransform(DPR,0,0,DPR,0,0);
  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0, c.bg1); g.addColorStop(1, c.bg2);
  x.fillStyle = g; x.fillRect(0,0,W,H);
  x.globalAlpha = 0.09; x.font = "34px serif"; x.textAlign="center"; x.textBaseline="middle";
  for (let y=0;y<ROWS;y+=4) for (let xx=0;xx<COLS;xx+=4)
    x.fillText(c.deco, (xx+1.5)*CELL, (y+1.5)*CELL);
  x.globalAlpha = 1;
  x.strokeStyle = "rgba(255,255,255,0.04)"; x.lineWidth = 1;
  x.beginPath();
  for (let i=0;i<=COLS;i++){ x.moveTo(i*CELL,0); x.lineTo(i*CELL,H); }
  for (let j=0;j<=ROWS;j++){ x.moveTo(0,j*CELL); x.lineTo(W,j*CELL); }
  x.stroke();
  return cv;
}
function drawBG(){
  const bg = bgCache[level] || (bgCache[level] = buildBG(level));
  ctx.drawImage(bg, 0, 0, W, H);
}
const foodCache = {};
function buildFood(lv){
  const S = Math.ceil(CELL*1.6);
  const cv = document.createElement("canvas");
  cv.width = S*DPR; cv.height = S*DPR;
  const x = cv.getContext("2d");
  x.setTransform(DPR,0,0,DPR,0,0);
  x.shadowColor = "rgba(255,255,255,.65)"; x.shadowBlur = 14;
  x.font = Math.round(CELL*0.92) + "px serif";
  x.textAlign="center"; x.textBaseline="middle";
  x.fillText(CHARACTERS[lv].fruit, S/2, S/2);
  cv.logical = S;
  return cv;
}
function drawFood(now){
  const sp = foodCache[level] || (foodCache[level] = buildFood(level));
  const pulse = 1 + 0.12*Math.sin(now/170);
  const sz = sp.logical*pulse;
  ctx.drawImage(sp, (food.x+0.5)*CELL - sz/2, (food.y+0.5)*CELL - sz/2, sz, sz);
}
function drawSnake(now){
  if (snake.length === 0) return;   // খেলা শুরুর আগে সাপ খালি থাকলে কিছু আঁকবে না
  const c = CHARACTERS[level];
  let al = 1;
  if (state === "playing" || state === "paused"){ al = Math.max(0, Math.min(1, stepAcc / getSpeed())); }
  const pts = snake.map((p,i) => {
    const o = prevSnake[i] || prevSnake[prevSnake.length-1] || p;
    return { x:(o.x + (p.x-o.x)*al + 0.5)*CELL, y:(o.y + (p.y-o.y)*al + 0.5)*CELL };
  });
  const n = pts.length;
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // শরীর: আগে কালো বর্ডার, তারপর রঙ — লেজের দিকে ক্রমশ সরু
  for (let pass=0; pass<2; pass++){
    for (let i=n-1;i>=1;i--){
      const t = 1 - i/n;                       // মাথার কাছে 1, লেজে ~0
      const w = CELL*(0.62 + 0.24*t) + (pass===0 ? 5 : 0);
      ctx.strokeStyle = pass===0 ? "rgba(0,0,0,.55)" : c.body;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i-1].x, pts[i-1].y); ctx.stroke();
    }
  }
  // শরীরের ডোরা/দাগ
  for (let i=1;i<n;i++){
    if (i % 2 === 0) continue;
    const t = 1 - i/n;
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, CELL*(0.10+0.07*t), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  // মাথা: শুধু মুখ (গলা ছাড়া), একটু বড় করে, সোজা থাকবে
  const open = now < mouthOpenUntil;
  const img = open ? c.openImg : c.normalImg;
  const tilt = dir.x * 0.18;
  const pop = open ? 1.12 : 1;
  const size = CELL * 2.3 * pop;
  ctx.save();
  ctx.translate(pts[0].x, pts[0].y);
  ctx.rotate(tilt);
  ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(0, size*0.38, size*0.34, size*0.1, 0, 0, Math.PI*2); ctx.fill();
  if (img.complete && img.naturalWidth) ctx.drawImage(img, -size/2, -size/2, size, size);
  else { ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(0,0,CELL*0.9,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

/* ---------- লুপ ---------- */
function update(dt, now){
  if (state === "playing"){
    stepAcc += dt;
    const speed = getSpeed();
    while (stepAcc >= speed){ stepAcc -= speed; step(); if (state!=="playing") break; }
  } else if (state === "levelup" && now >= levelupUntil){
    startLevel(); hideOverlay(); state = "playing";
  } else if (state === "jumpscare" && now >= jumpscareUntil){
    jumpscare.classList.add("hidden");
    state = "won";
    showOverlay(CHARACTERS[level].normalImg.src, "তুমি জিতেছো! 🏆", "সব ৬ জনের পালা শেষ! মোট স্কোর: " + bn(totalScore), "আবার খেলুন 🔄");
  }
}
let last = performance.now();
function frame(now){
  const dt = Math.min(now-last, 100); last = now;
  update(dt, now);
  drawBG(); drawFood(now); drawSnake(now);
  requestAnimationFrame(frame);
}

/* ---------- ইনপুট ---------- */
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  let nd = null;
  if (k==="arrowup"||k==="w") nd = DIRS[3];
  else if (k==="arrowdown"||k==="s") nd = DIRS[1];
  else if (k==="arrowleft"||k==="a") nd = DIRS[2];
  else if (k==="arrowright"||k==="d") nd = DIRS[0];
  if (nd){ e.preventDefault(); if (state==="playing") queueDir(nd); }
  else if (k===" "){ e.preventDefault(); togglePause(); }
  else if (k==="enter"){ if (state==="menu"||state==="gameover"||state==="won") startGame(); }
});

    if (state==="playing") queueDir(m[b.dataset.d]);
  });
});
let touchStart = null;
canvas.addEventListener("touchstart", e => { touchStart = e.touches[0]; }, {passive:true});
canvas.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
canvas.addEventListener("touchend", e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
  if (Math.abs(dx)<22 && Math.abs(dy)<22) return;
  if (state==="playing"){
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx>0 ? DIRS[0] : DIRS[2]);
    else queueDir(dy>0 ? DIRS[1] : DIRS[3]);
  }
  touchStart = null;
});

/* ---------- সাউন্ড টগল ---------- */
muteBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  muteBtn.textContent = soundOn ? "🔊" : "🔇";
  if (soundOn) ensureAudio();
});

/* ---------- শুরু ---------- */
jsImg.src = SCARY_SVG;
loadCharacterImages();
setupCanvas();
updateHUD();
showOverlay(CHARACTERS[0].normalImg.src, "সাপের খেলা 🐍", "৬ জনের ছবি নিয়ে খেলা — ফল খাও, পরের জনের পালা! শেষে ভয়ংকর কিছু আছে 👀", "শুরু করুন ▶");
requestAnimationFrame(frame);
</script>
